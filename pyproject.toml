[project]
name = "persuadables"
version = "0.1.0"
description = "Who does a marketing campaign actually persuade? A/B testing done properly, then uplift models that find the customers worth targeting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aamod Bhatt" }]
requires-python = ">=3.12,<3.13"
keywords = [
  "uplift-modeling",
  "causal-inference",
  "ab-testing",
  "cuped",
  "off-policy-evaluation",
  "xgboost",
  "duckdb",
  "marketing-analytics",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.1",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  # The CPU-only build of XGBoost (same `xgboost` import, without the CUDA/NCCL wheels) ships
  # only Linux and Windows wheels; on macOS the regular wheels are CPU-only anyway.
  "xgboost-cpu>=2.1; sys_platform != 'darwin'",
  "xgboost>=2.1; sys_platform == 'darwin'",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "pydantic>=2.9",
  "typer>=0.15",
]

[project.scripts]
persuadables = "persuadables.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "scipy-stubs>=1.14",
  # Reference implementations that the test suite cross-checks every statistic against.
  "statsmodels>=0.14.4",
]
docs = ["playwright>=1.49"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persuadables"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET", "TID", "PL", "NPY", "PERF",
]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "statsmodels", "statsmodels.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning:persuadables.*"]
